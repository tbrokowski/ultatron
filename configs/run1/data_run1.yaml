  105US:                    "/capstor/store/cscs/swissai/a127/ultrasound/raw/liver/105US"
  # ── Fetal ─────────────────────────────────────────────────────────────────
  ACOUSLIC-AI:              "/capstor/store/cscs/swissai/a127/ultrasound/raw/fetal/ACOUSLIC"
