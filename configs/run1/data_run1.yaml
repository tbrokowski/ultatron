  CUBS:                     "/capstor/store/cscs/swissai/a127/ultrasound/raw/vascular-carotid/CUBS"
  Common-Carotid-Artery-Ultrasound-Images: "/capstor/store/cscs/swissai/a127/ultrasound/raw/vascular-carotid/Common-Carotid-Artery-Ultrasound-Images"
  # ── Brain ─────────────────────────────────────────────────────────────────
  3D-US-Neuroimages-Dataset: "/capstor/store/cscs/swissai/a127/ultrasound/raw/brain/3D-US-Neuroimages-Dataset"
  BITE:                     "/capstor/store/cscs/swissai/a127/ultrasound/raw/brain/BITE"
  REMIND-Brain-iUS:         "/capstor/store/cscs/swissai/a127/ultrasound/raw/brain/REMIND-Brain-iUS"
