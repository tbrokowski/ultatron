# configs/run1/data_run1.yaml
# Run1 data config — dinov3_l + vjepa2_l, 10k steps.
#
# Manifest: built from all datasets below (118) via:
#   python3 scripts/build_manifest.py \
#     --config configs/run1/data_run1.yaml \
#     --out dataset_exploration_outputs/run1/run1_train_v3.jsonl
#
# Storage layout:
#   Store:   /capstor/store/cscs/swissai/a127/ultrasound/raw/{anatomy}/{dataset}/
#   Scratch: /capstor/scratch/cscs/$USER/ultrasound/raw/{anatomy}/{dataset}/
#
# datasets: below lists Store paths (source for staging). Manifests are built
# with Scratch paths when staged (build_manifest.py --prefer-scratch).
# Stage all: bash scripts/submit_stage.sh --config configs/run1/data_run1.yaml
#   Cardiac (15), Breast (14), Lung (13), Liver (10), Fetal (17), Thyroid (9),
#   Vascular (2), Brain (6), Kidney (2), Gallbladder (3), Abdomen (2),
#   Ovarian (4), Prostate (3), Musculoskeletal (11), Nerve (2),
#   Multi-organ (3), Ocular (1), Skin (1)
#
# Rebuild manifest with:
#   python scripts/build_manifest.py \
#     --config configs/run1/data_run1.yaml \
#     --out dataset_exploration_outputs/run1/run1_train_v3.jsonl
# =============================================================================

manifest:
  # v1 (13 datasets, 666k entries):
  #   dataset_exploration_outputs/run1/run1_train.jsonl
  # v1.5 (partial, 32 datasets):
  #   dataset_exploration_outputs/run1/run1_train_all.jsonl
  # v2 (109 datasets):
  #   dataset_exploration_outputs/run1/run1_train_v2.jsonl
  # v3 (canonical run1 manifest):
  path: "dataset_exploration_outputs/run1/run1_train_v3.jsonl"
  val_path: null
  # {} → manifest paths are Scratch-absolute; no store→scratch remap at load time.
  # Use null only for legacy manifests that still contain Store paths.
  root_remap: {}

loaders:
  image_batch_size: 64
  video_batch_size: 32   
  num_workers: 8
  pin_memory: true

transforms:
  patch_size: 16
  image:
    n_global_crops: 4
    global_crop_scale: [0.4, 1.0]
    n_local_crops: 8
    local_crop_scale: [0.05, 0.4]
    patch_size: 16
    mask_ratio: 0.40
    max_global_crop_px: 256   # matches res_px_1=256; curriculum ramps to 384→512 at later steps
    min_crop_px: 32
    brightness: 0.4
    contrast: 0.4
    apply_speckle: true
    speckle_sigma: 0.10
    apply_blur: true
    blur_sigma: [0.1, 2.0]
    apply_solarize: true
    solarize_thresh: 0.5
    allow_hflip: false
    allow_vflip: false
    max_rotation_deg: 15.0
    freq_mask:
      r_inner_min: 0.10
      r_outer_max: 0.95
      band_width_min: 0.15
      band_width_max: 0.40
      mask_ratio: 0.40
      use_alp_bias: true
      perturb_phase: false
      phase_perturb_sigma: 0.10
      n_bands: 1
  video:
    n_frames: 32
    max_n_frames: 64
    temporal_stride: 8
    tube_mask_ratio: 0.75
    min_mask_ratio: 0.40
    max_mask_ratio: 0.80
    max_crop_px: 112          # matches res_vid_px_1=112; curriculum ramps to 128→160 at later steps
    min_crop_px: 64
    crop_scale: [0.5, 1.0]
    allow_hflip: false
    apply_speckle: true
    speckle_sigma: 0.08
    mask_strategy: "freq"
    tube_size: 8
    spatial_mask_ratio: 0.40
    freq_mask:
      r_inner_min: 0.10
      r_outer_max: 0.95
      band_width_min: 0.20
      band_width_max: 0.50
      mask_ratio: 0.75
      use_alp_bias: true
      perturb_phase: false
      phase_perturb_sigma: 0.10
      n_bands: 1

curriculum:
  total_training_steps: 10000
  image_samples_per_epoch: 12000
  video_samples_per_epoch: 20000

gram_anchoring:
  start_step: 999999
  refresh_interval: 50000
  lambda: 0.0

anatomy_weights:
  cardiac:  0.5   # heavily down-weighted: MIMIC-IV-ECHO alone is 525k entries
  fetal:    1.0
  breast:   1.2
  lung:     1.5
  liver:    1.5
  thyroid:  1.5
  brain:    2.0
  vascular-carotid: 2.0
  kidney:   1.0
  gallbladder: 1.0
  abdominal: 1.0
  ovarian:  1.0
  prostate: 1.0
  musculoskeletal: 1.0
  nerve:    1.0
  multi_organ: 1.0
  ocular:   1.0
  skin:     1.0

