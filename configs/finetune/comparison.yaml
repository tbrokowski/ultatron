# Master comparison config — backbone × head_type × experiment sweep
#
# Usage:
#   python scripts/finetune.py --comparison-config configs/finetune/comparison.yaml
#
# Update checkpoint paths below before running external / phase-specific backbones.

train_config: configs/experiments/run1.yaml

output_dir: eval_results
device: cuda
eval_only: false

backbones:
  - key: resnet50
    type: standard
    variant: resnet50

  - key: vit_b_16
    type: standard
    variant: vit_b_16

  - key: dinov3_b
    type: dinov3
    variant: dinov3_b

  - key: biomedclip
    type: biomedclip

  - key: vjepa2_l
    type: vjepa
    variant: vjepa2_l

  # External FMs — weights on Capstor store (see finetune/backbones/paths.py)
  - key: usfm
    type: usfm
    checkpoint: /capstor/store/cscs/swissai/a127/ultrasound/checkpoints/Ablations/USFM_latest.pth
    embed_dim: 768

  - key: echocare
    type: echocare
    checkpoint: /capstor/store/cscs/swissai/a127/ultrasound/checkpoints/Ablations/echocare_encoder.pth
    embed_dim: 2048   # MONAI SwinTransformer final stage (128 * 2^4)
    is_video: false

  - key: openus
    type: openus
    checkpoint: /capstor/store/cscs/swissai/a127/ultrasound/checkpoints/Ablations/openus_cpt0150.pth
    vmamba_checkpoint: /capstor/store/cscs/swissai/a127/ultrasound/checkpoints/Ablations/vssm_small_0229_ckpt_epoch_222.pth
    embed_dim: 768

  # Ultatron phase checkpoints — update paths to your run
  - key: ours_phase1
    type: ours
    checkpoint: /capstor/scratch/cscs/tbrokowski/ultrasound/checkpoints/run1/phase1_end.pt

  - key: ours_phase2
    type: ours
    checkpoint: /capstor/scratch/cscs/tbrokowski/ultrasound/checkpoints/run1/phase2_end.pt

  - key: ours_phase3
    type: ours
    checkpoint: /capstor/scratch/cscs/tbrokowski/ultrasound/checkpoints/run1/phase3_end.pt

experiments:
  - busi
  - busbra
  - camus
  - echonet
  - echonet_ped
  - echonet_lvh
  - mimic_lvvol
  - cardiacudc
  - echocp
  - tn3k
  - lus
  - lus_video

# Parallel layout: 1 GPU per experiment, all backbones sequential on that GPU.
parallel_experiments: true
parallel_strategy: per_experiment

head_types:
  default: [dpt]
  busbra: [upernet, dpt]
  tn3k: [dpt]
  echonet: [mlp]
  lus: [mil]
  lus_video: [mlp]

# Dataset roots — paths mirror configs/run1/data_run1.yaml (datasets: section).
# Override via env vars or edit here; empty string means skip.
dataset_roots:
  busi:       "/capstor/store/cscs/swissai/a127/ultrasound/raw/breast/BUSI"
  busbra:     "/capstor/store/cscs/swissai/a127/ultrasound/raw/breast/BUSBRA"
  camus:      "/capstor/store/cscs/swissai/a127/ultrasound/raw/cardiac/CAMUS"
  echonet:    "/capstor/store/cscs/swissai/a127/ultrasound/raw/cardiac/EchoNet-Dynamic"
  echonet_ped: "/capstor/store/cscs/swissai/a127/ultrasound/raw/cardiac/EchoNet-Pediatric"
  echonet_lvh: "/capstor/store/cscs/swissai/a127/ultrasound/raw/cardiac/EchoNet-LVH"
  mimic_lvvol: "/capstor/store/cscs/swissai/a127/ultrasound/raw/cardiac/MIMIC-IV-Echo-LVVol-A4C"
  cardiacudc: "/capstor/store/cscs/swissai/a127/ultrasound/raw/cardiac/CardiacUDC"
  echocp:     "/capstor/store/cscs/swissai/a127/ultrasound/raw/cardiac/EchoCP"
  tn3k:       "/capstor/store/cscs/swissai/a127/ultrasound/raw/thyroid/TN3K"
  benin:      "/capstor/store/cscs/swissai/a127/ultrasound/raw/lung/Benin_Videos"
  rsa:        "/capstor/store/cscs/swissai/a127/ultrasound/raw/lung/RSA_Videos"
