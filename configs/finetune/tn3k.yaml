# configs/finetune/tn3k.yaml
# ============================================================
# TN3K thyroid nodule segmentation — OpenUS protocol
#
# Paper: Zheng et al., "OpenUS" (arXiv:2511.11510), Sec. 7.2
#   Split: 2303 train / 576 val / 614 test (trainval fold 0)
#   Resize: 224×224, AdamW lr=1e-4, wd=0.05, batch=16, 100 epochs
#   Metrics: DSC, IoU (frozen backbone + segmentation head)
#
# Usage:
#   python -m finetune.experiments.tn3k --config configs/finetune/tn3k.yaml ...
# ============================================================

dataset_root: "/capstor/store/cscs/swissai/a127/ultrasound/raw/thyroid/TN3K"

model:
  image_backbone: dinov3_l
  video_backbone: vjepa2_l
  frozen_teacher: null
  dtype: bfloat16

finetune:
  # ── Optimiser (OpenUS Sec. 7.2) ─────────────────────────────────────────────
  lr:           1.0e-4
  weight_decay: 0.05
  max_epochs:   100
  batch_size:   16
  num_workers:  4

  # ── Head ────────────────────────────────────────────────────────────────────
  head_type:         dpt
  freeze_backbone:   true

  # ── TN3K / OpenUS protocol ──────────────────────────────────────────────────
  cv_fold:           0

  # ── Early stopping ───────────────────────────────────────────────────────────
  patience:      100
  monitor:       val_dice
  monitor_mode:  max

  # ── Resolution ───────────────────────────────────────────────────────────────
  input_size:    224
  output_size:   224

  # ── Logging / checkpointing ──────────────────────────────────────────────────
  log_every:       5
  checkpoint_best: true

  # ── Enhanced seg head (frozen backbone) ─────────────────────────────────────
  boundary_loss_weight: 0.5
  refine_up: true
  seg_use_adapters: true
  seg_use_aspp: true
