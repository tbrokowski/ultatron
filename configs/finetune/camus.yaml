# configs/finetune/camus.yaml
# ============================================================
# Finetune hyperparameters for CAMUS.
# Loaded by oura.finetune.camus.CAMUSFinetune
# Usage: python -m oura.finetune.camus --config configs/finetune/camus.yaml ...
# ============================================================

dataset_root: "/capstor/store/cscs/swissai/a127/ultrasound/raw/cardiac/CAMUS"

# Model backbone (which checkpoint to load from)
model:
  image_backbone: dinov3_l
  video_backbone: vjepa2_l
  frozen_teacher: null       # not needed for finetune; saves memory
  dtype: bfloat16

finetune:
  # ── Optimiser ───────────────────────────────────────────────────────────────
  lr:           1.0e-4
  weight_decay: 0.01
  max_epochs:   50
  batch_size:   16
  num_workers:  4

  # ── Head architecture ────────────────────────────────────────────────────────
  # "linear" = LinearSegHead (1 linear layer on patch tokens)
  # "dpt"    = DPTSegHead (conv neck + bilinear upsample; better for dense pred)
  # "mlp"    = MLPClsHead (2-layer MLP on CLS token, for classification tasks)
  head_type:  dpt


  # ── CAMUS protocol (Leclerc et al., IEEE TMI 2019) ─────────────────────────
  # Patient split: folds 1–8 train (IDs 1–400), fold 9 val (401–450), fold 10 test (451–500).
  # Training variant: lv_endo | lv_epi | la | multiclass (paired metrics only).
  camus_variant: lv_epi
  camus_training_mode: binary
  lv_target: lv_structures
  camus_quality_filter: false   # set true for TMI Table III (Good + Medium only)

  # ── Early stopping ───────────────────────────────────────────────────────────
  patience:      50
  monitor:       val_dice      # metric key in compute_val_metrics() output
  monitor_mode:  max          # "max" for dice/auc, "min" for loss/mae

  # ── Backbone ─────────────────────────────────────────────────────────────────
  freeze_backbone: true        # keep backbone frozen; only head is trained

  # ── Resolution ───────────────────────────────────────────────────────────────
  output_size: 224             # head output is upsampled to this before loss
  input_size: 256              # fixed resize for all backbones (CAMUS native ~549×389)
  native_max_px: 512           # only used when native_resolution=true and input_size=0

  # ── Logging / checkpointing ──────────────────────────────────────────────────
  log_every:       5           # log every N epochs
  checkpoint_best: true        # save best_head.pt when monitor improves

  boundary_loss_weight: 0.5
  refine_up: true
  seg_use_adapters: true
  seg_use_aspp: true
  seg_use_attention_gates: true
