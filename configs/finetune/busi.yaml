# configs/finetune/busi.yaml
# ============================================================
# BUSI — frozen backbone + task head only (comparison / finetune sweep)
#
# Target: ~0.84 dice_tumor_mean on USFM 70/15/15 split (tumour images).
# Backbone weights stay frozen; only DPT/UPerNet head is trained.
#
# For full USFM paper replication (end-to-end UPerNet @ 512px, ~84% DSC):
#   bash scripts/run_busi_finetune.sh
#
# Prepare split manifest once:
#   python scripts/prepare_busi_usfm_split.py
# ============================================================

dataset_root: "/capstor/store/cscs/swissai/a127/ultrasound/raw/breast/BUSI"

model:
  image_backbone: dinov3_l
  video_backbone: vjepa2_l
  frozen_teacher: null
  dtype: bfloat16

finetune:
  # ── Optimiser (head only) ───────────────────────────────────────────────────
  lr:           3.0e-4      # higher LR is standard for frozen-feature probing
  weight_decay: 0.01
  max_epochs:   300
  batch_size:   8
  num_workers:  4

  # ── Head ────────────────────────────────────────────────────────────────────
  head_type:    dpt
  freeze_backbone: true      # required for this config

  # ── BUSI protocol (USFM breast segmentation) ────────────────────────────────
  seg_only:            true   # tumour seg head only — no cls multitask
  tumor_only_train:    false  # include normal images as negatives (93 extra train samples)
  eval_tumor_only:     true   # primary metric: dice_tumor_mean (benign+malignant only)
  split_manifest:      dataset_exploration_outputs/busi_usfm/split_manifest.json
  seg_loss_weight:      1.0
  cls_loss_weight:      0.0
  seg_only_epochs:      0
  bg_seg_loss_weight:   0.25   # low weight on normal-image background loss
  boundary_loss_weight: 0.5    # boundary ring BCE (dilation-erosion of GT mask)
  refine_up:            true   # SubPixelRefinement: stride-4→stride-2 learned upsample
  seg_use_adapters:     true
  seg_use_aspp:         true
  seg_use_attention_gates: true

  # ── Early stopping ───────────────────────────────────────────────────────────
  patience:      80
  monitor:       dice_tumor_mean
  monitor_mode:  max

  # ── Resolution ───────────────────────────────────────────────────────────────
  input_size:        500        # match BUSI native resolution (~500×500px images)
  output_size:       500        # ignored by UPerNet (student); used by DPT upsample
  native_resolution: false      # opt-in pretrain-style crops (requires input_size=0)
  native_max_px:     512        # only used when native_resolution=true and input_size=0

  log_every:       5
  checkpoint_best: true
